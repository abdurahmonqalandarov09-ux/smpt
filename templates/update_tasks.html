{% extends 'base.html' %}
{% block title %}Edit task · TaskFlow{% endblock %}{% block breadcrumb %}Edit task{% endblock %}
{% block content %}
<div class="form-page"><a class="back-link" href="{% url 'show_tasks' %}">← Back to tasks</a><div class="eyebrow">EDIT TASK</div><h1>Update your task</h1><p class="muted">Change the details below and save your updates.</p><div class="panel form-panel"><form method="post">{% csrf_token %}<label>Task name</label><input name="name" type="text" maxlength="120" value="{{ task.name }}" required><label>Description</label><textarea name="caption" rows="6" required>{{ task.caption }}</textarea><div class="form-buttons"><a class="btn secondary" href="{% url 'show_tasks' %}">Cancel</a><button class="btn primary" type="submit">Save changes</button></div></form></div></div>
{% endblock %}
